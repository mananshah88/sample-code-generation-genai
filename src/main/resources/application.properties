# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:filedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Actuator Configuration
management.endpoints.web.exposure.include=health,metrics,circuitbreakers,ratelimiters
management.endpoint.health.show-details=always

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.uploadCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.uploadCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.uploadCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.uploadCircuitBreaker.permittedNumberOfCallsInHalfOpenState=5

resilience4j.circuitbreaker.instances.getFilesCircuitBreaker.slidingWindowSize=10
resilience4j.circuitbreaker.instances.getFilesCircuitBreaker.failureRateThreshold=50
resilience4j.circuitbreaker.instances.getFilesCircuitBreaker.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.getFilesCircuitBreaker.permittedNumberOfCallsInHalfOpenState=5

# Rate Limiter Configuration
resilience4j.ratelimiter.instances.uploadLimiter.limitForPeriod=10
resilience4j.ratelimiter.instances.uploadLimiter.limitRefreshPeriod=60s
resilience4j.ratelimiter.instances.uploadLimiter.timeoutDuration=5s

# AWS Configuration
aws.access.key.id=your-access-key
aws.secret.access.key=your-secret-key
aws.s3.region=your-region
aws.s3.bucket=your-bucket
