# Maximum file size
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

# Server port
server.port=8081

# Enable multipart uploads
spring.servlet.multipart.enabled=true

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Resilience4j Configuration
resilience4j.ratelimiter.instances.fileUpload.limitForPeriod=10
resilience4j.ratelimiter.instances.fileUpload.limitRefreshPeriod=1s
resilience4j.ratelimiter.instances.fileUpload.timeoutDuration=0s

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.fileUpload.slidingWindowSize=10
resilience4j.circuitbreaker.instances.fileUpload.failureRateThreshold=50
resilience4j.circuitbreaker.instances.fileUpload.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.fileUpload.permittedNumberOfCallsInHalfOpenState=3

# H2 Database Configuration
spring.datasource.url=jdbc:h2:file:./data/fileuploaddb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# AWS Configuration
aws.access.key.id=AKIAXXXXXXXXXXXXXXXX
aws.secret.access.key=XXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX
aws.s3.region=us-east-1
aws.s3.bucket.name=your-bucket-name 